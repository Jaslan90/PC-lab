<!doctype html>
<html lang="nl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Netwerk bouwen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Concept: een netwerkschema op ruitjespapier. Koper is het enige accent, blauw is wifi. */
:root{
  color-scheme:light;
  --bg:#e8eee7; --grid:#d0dcd2; --surface:#f5f8f3; --ink:#15221c; --muted:#556860; --line:#b4c4b8;
  --copper:#b85a22; --on-copper:#ffffff; --ok:#1d7447; --warn:#a56a10; --bad:#b0342a;
  --cool:#2f6aa8; --hot:#c8432b;
  --pcb:#1f5e4a; --pcb-d:#143f31; --metal:#aab5ae; --metal2:#8d9a93; --slot:#0f1d18; --gold:#d6a62c;
  --gpu:#2c3531; --psu:#3a4742; --casef:#dde6dc; --case:#6a7b72; --cpu:#c9d2cc; --ram:#2f6aa8;
  --disp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111b17; --grid:#1a2a24; --surface:#192520; --ink:#e4eee8; --muted:#8fa69b; --line:#2f433a;
    --copper:#e58f55; --on-copper:#1b110a; --ok:#58c88c; --warn:#e3ab4c; --bad:#f0796c;
    --cool:#5b9ae0; --hot:#f0796c;
    --pcb:#2f7d64; --pcb-d:#1f5646; --metal:#6d7b74; --metal2:#55645d; --slot:#070d0b; --gold:#e4b94d;
    --gpu:#3a4640; --psu:#46544e; --casef:#14201b; --case:#4d6057; --cpu:#aab6af; --ram:#5b9ae0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111b17; --grid:#1a2a24; --surface:#192520; --ink:#e4eee8; --muted:#8fa69b; --line:#2f433a;
  --copper:#e58f55; --on-copper:#1b110a; --ok:#58c88c; --warn:#e3ab4c; --bad:#f0796c;
  --cool:#5b9ae0; --hot:#f0796c;
  --pcb:#2f7d64; --pcb-d:#1f5646; --metal:#6d7b74; --metal2:#55645d; --slot:#070d0b; --gold:#e4b94d;
  --gpu:#3a4640; --psu:#46544e; --casef:#14201b; --case:#4d6057; --cpu:#aab6af; --ram:#5b9ae0;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;
  background-color:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);
  padding-inline:16px;padding-block:0 56px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--copper);outline-offset:2px}
.wrap{max-width:1100px;margin-inline:auto}
.top{padding-block:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px 24px;flex-wrap:wrap}
.back{font-size:13px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
.back:hover{color:var(--copper);border-color:var(--copper)}
.brand{display:block;font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.brand span{color:var(--copper)}
.links{display:flex;gap:14px;flex-wrap:wrap}
h1{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:clamp(28px,4vw,44px);line-height:.95;margin:0 0 8px;text-wrap:balance;overflow-wrap:anywhere}
h2{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:22px;letter-spacing:.02em;line-height:1.05;margin:0 0 8px}
p{margin:0 0 10px}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.muted{color:var(--muted)}.small{font-size:14px}

.game{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.game{grid-template-columns:minmax(0,1fr)}}
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap;margin-bottom:14px}
.intro h1{font-size:clamp(26px,3.4vw,38px);margin:0 0 2px}
.intro p{margin:0}
.intro .kicker{display:none}
.main{min-width:0;display:grid;gap:12px}
.panel{background:var(--surface);border:1.5px solid var(--ink);padding:16px;min-width:0;display:grid;gap:14px}
.box{background:var(--surface);border:1.5px solid var(--ink);padding:14px;min-width:0}
.levels{display:flex;gap:6px;flex-wrap:wrap}
.lv{background:var(--bg);border:1.5px solid var(--line);padding:8px 12px;cursor:pointer;min-height:42px;border-radius:3px;text-align:left}
.lv:hover{border-color:var(--ink)}
.lv[aria-pressed="true"]{border-color:var(--ink);font-weight:600;box-shadow:inset 0 -3px 0 var(--copper)}
.lv .st{color:var(--copper);letter-spacing:.1em;margin-left:6px}
.count{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.count b{font-family:var(--mono);font-weight:500;font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:6px 14px;border:1.5px solid var(--ink);background:transparent;cursor:pointer;border-radius:3px;font-weight:500}
.btn:hover{border-color:var(--copper);color:var(--copper)}
.btn[disabled],.ict-btn[disabled]{opacity:.45;cursor:not-allowed}
.stars{font-size:22px;letter-spacing:.12em;color:var(--copper)}
.tips{display:grid;gap:8px}
.tip{border-left:4px solid var(--line);background:var(--bg);padding:8px 12px;font-size:14px}
.tip.bad{border-color:var(--bad)}.tip.ok{border-color:var(--ok)}.tip.warn{border-color:var(--warn)}
.learn{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.learn b{font-weight:600}
.small{font-size:14px}.muted{color:var(--muted)}

.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:6px 14px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;border-radius:3px;font-weight:500}
.tool[aria-pressed="true"]{border-color:var(--ink);font-weight:600;box-shadow:inset 0 -3px 0 var(--copper)}
.tool svg{width:34px;height:10px}
.scenebox{background:var(--surface);border:1.5px solid var(--ink);min-width:0}
.scene{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.nd{cursor:pointer}
.nd:focus{outline:none}
.nd:focus-visible .hl,.nd.sel .hl{stroke:var(--copper);stroke-width:3;stroke-dasharray:none}
.nd .hl{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.nd.sel .hl{fill:var(--bg)}
.nd text{font-family:var(--body);font-size:13px;fill:var(--ink);font-weight:600}
.nd .sub{font-family:var(--mono);font-size:10px;fill:var(--muted);font-weight:400}
.nd.ok .hl{stroke:var(--ok);stroke-width:2.5}
.nd.no .hl{stroke:var(--bad);stroke-width:2.5}
.lk{cursor:pointer}
.lk .vis{stroke:var(--ink);stroke-width:3;fill:none}
.lk.wifi .vis{stroke:var(--cool);stroke-dasharray:3 6;stroke-linecap:round}
.lk .hit{stroke:transparent;stroke-width:16;fill:none}
.lk:hover .vis{stroke:var(--bad)}
.fix .vis{stroke:var(--muted);stroke-width:4;fill:none}
.ports{font-family:var(--mono);font-size:12px;color:var(--muted)}
</style>

<div class="wrap">
  <header class="top">
    <div><a class="back" href="index.html">&larr; Alle ICT-lessen</a><span class="brand">Netwerk<span>-bouwen</span></span></div>
    <div class="links"><button type="button" class="ict-theme" data-theme-toggle aria-pressed="false"></button></div>
  </header>
  <div id="app"></div>
</div>

'use strict';
var ICT=window.ICT=window.ICT||{};

function set(k,v){try{localStorage.setItem(k,v);}catch(e){}}

/* ---------- stijl voor de gedeelde onderdelen ---------- */
var css=''+
':root{--wood:#8a5a2b;--wood2:#6e451f}'+

':root[data-theme="dark"]{--wood:#b27a42;--wood2:#8d5f31}'+
'.ict-theme{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--body);cursor:pointer;border-radius:3px}'+
'.ict-theme:hover{border-color:var(--copper);color:var(--copper)}'+
'.kist{background:var(--surface);border:1.5px solid var(--ink);padding:18px;display:grid;gap:14px;min-width:0;margin-top:20px}'+
'.kist h2{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:24px;letter-spacing:.02em;line-height:1.05;margin:0}'+
'.kist p{margin:0}'+
'.kist .muted{color:var(--muted)}.kist .small{font-size:14px}'+
'.kist-row{display:grid;grid-template-columns:minmax(0,400px) 150px;justify-content:start;gap:24px;align-items:center}'+

'.kist-parts{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:15px}'+
'.kist-parts li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px}'+
'.kist-parts .y{color:var(--ok)}.kist-parts .n{color:var(--muted)}'+
'.kist-win{font-weight:600;color:var(--ok)}'+
'.ict-btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 18px;border:1.5px solid var(--copper);background:var(--copper);color:var(--on-copper);font:600 15px var(--body);cursor:pointer;border-radius:3px;justify-self:start}'+
'.ict-btn:hover{filter:brightness(1.07)}'+
'.proof{border:2px solid var(--gold);background:var(--bg);padding:18px;display:grid;gap:8px}'+
'.proof .kk{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}'+
'.proof .pname{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:clamp(30px,6vw,48px);line-height:1;margin:0;overflow-wrap:anywhere}'+
'.proof label{font-size:14px;font-weight:600}'+
'.proof input{font:400 16px var(--body);padding:8px 10px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);max-width:320px;border-radius:3px}'+
'.proof .small{font-size:14px;color:var(--muted)}'+
'@media (prefers-reduced-motion:no-preference){.twinkle{animation:tw 1.8s ease-in-out infinite}.twinkle.b{animation-delay:.6s}.twinkle.c{animation-delay:1.1s}@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}}';

var root=document.documentElement;
var savedTheme=get('ict-theme');
if(savedTheme==='dark'||savedTheme==='light')root.setAttribute('data-theme',savedTheme);
function loadFont(){if(document.getElementById('ict-cinzel'))return;try{var l=document.createElement('link');l.id='ict-cinzel';l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap';document.head.appendChild(l);}catch(e){}}
function applyStyle(s){
 if(s==='rpg'){root.setAttribute('data-style','rpg');if(!get('ict-theme'))root.setAttribute('data-theme','dark');loadFont();}
 else{root.removeAttribute('data-style');if(!get('ict-theme'))root.removeAttribute('data-theme');}
}
applyStyle(get('ict-stijl'));
function isRpg(){return root.getAttribute('data-style')==='rpg';}

 });

function parts(key,levels){var b={};try{b=JSON.parse(get(key))||{};}catch(e){}return levels.map(function(l){return (b[l.id]||0)>0;});}

function dateFor(id,all){
 if(!all)return '';
 var k='ict-datum-'+id,d=get(k);
 if(!d){d=new Date().toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'});set(k,d);}
 return d;
}
var reg={},shown={};
function keySVG(ok,all){
 var o=all?[0,0,0]:[0,10,20],G='var(--gold)',ST='var(--wood2)',M='var(--muted)';
 function paintPart(on){return on?'fill="'+G+'" stroke="'+ST+'" stroke-width="2"':'fill="none" stroke="'+M+'" stroke-width="2" stroke-dasharray="5 4"';}
 var s='<svg viewBox="0 0 330 110" role="img" aria-label="Sleutel in drie delen: '+ok.filter(Boolean).length+' van '+ok.length+' gevonden">';
 if(all)s+='<ellipse cx="165" cy="55" rx="150" ry="46" fill="'+G+'" opacity=".18"/>';
 /* deel 1: ring met hals */
 s+='<g transform="translate('+o[0]+' 0)"><path fill-rule="evenodd" '+paintPart(ok[0])+' d="M40 27a28 28 0 1 0 .01 0zM40 45a10 10 0 1 1-.01 0z"/><rect x="66" y="48" width="34" height="14" '+paintPart(ok[0])+'/></g>';
 /* deel 2: schacht */
 s+='<g transform="translate('+o[1]+' 0)"><rect x="100" y="48" width="125" height="14" '+paintPart(ok[1])+'/><rect x="132" y="42" width="8" height="26" '+paintPart(ok[1])+'/></g>';
 /* deel 3: baard met tanden */
 s+='<g transform="translate('+o[2]+' 0)"><path '+paintPart(ok[2])+' d="M225 48H300V84H288V70H276V84H264V70H252V84H240V62H225z"/></g>';
 if(all){s+='<g fill="'+G+'"><path class="twinkle" d="M20 10l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/><path class="twinkle b" d="M312 18l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><path class="twinkle c" d="M150 96l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></g>';}
 return s+'</svg>';
}
function chestSVG(all){
 var W='var(--wood)',W2='var(--wood2)',G='var(--gold)';
 var s='<svg class="chest" viewBox="0 0 160 130" role="img" aria-label="Schatkist, '+(all?'open':'dicht')+'">';
 if(all){
  s+='<circle cx="80" cy="60" r="58" fill="'+G+'" opacity=".2"/>';
  s+='<path d="M30 62L38 10Q80 0 122 10L130 62z" fill="'+W2+'" stroke="'+W2+'" stroke-width="2"/><path d="M42 58L47 18Q80 11 113 18L118 58z" fill="'+W+'"/>';
 }
 s+='<rect x="20" y="62" width="120" height="56" rx="5" fill="'+W+'" stroke="'+W2+'" stroke-width="3"/><rect x="20" y="82" width="120" height="7" fill="'+W2+'"/>';
 if(all){
  s+='<path d="M26 63Q46 34 80 38Q114 34 134 63z" fill="'+G+'" stroke="'+W2+'" stroke-width="1.5"/>';
  [[52,52],[72,46],[94,50],[112,56],[84,58],[62,60]].forEach(function(c){s+='<circle cx="'+c[0]+'" cy="'+c[1]+'" r="6" fill="'+G+'" stroke="'+W2+'" stroke-width="1.5"/>';});
  s+='<path class="twinkle" d="M80 14l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="'+G+'"/><path class="twinkle b" d="M128 30l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="'+G+'"/><path class="twinkle c" d="M30 28l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="'+G+'"/>';
 }else{
  s+='<path d="M20 62Q20 26 80 26Q140 26 140 62z" fill="'+W+'" stroke="'+W2+'" stroke-width="3"/><path d="M20 50H140" stroke="'+W2+'" stroke-width="5"/>';
  s+='<rect x="70" y="56" width="20" height="24" rx="3" fill="'+G+'" stroke="'+W2+'" stroke-width="2"/><circle cx="80" cy="66" r="3.5" fill="'+W2+'"/><rect x="78.5" y="66" width="3" height="8" fill="'+W2+'"/>';
 }
 return s+'</svg>';
}
function proofHTML(o,ok,date){
 var name=get('ict-naam')||'';
 return '<div class="proof" id="proof-'+esc(o.id)+'"><span class="kk">Bewijs van voltooiing</span>'+
  '<p class="pname" data-kist-name>'+(name?esc(name):'Jouw naam')+'</p>'+
  '<p>heeft alle '+o.levels.length+' niveaus van <b>'+esc(o.naam)+'</b> gehaald en de schatkist geopend.</p>'+
  '<p class="small">Behaald op '+esc(date)+'. Sleuteldelen: '+o.levels.map(function(l){return esc(l.naam);}).join(', ')+'.</p>'+
  '<label for="kist-naam">Typ hier je naam</label><input id="kist-naam" type="text" maxlength="40" autocomplete="off" value="'+esc(name)+'">'+
  '<p class="small">Maak een schermafbeelding van dit bewijs en lever die in bij je docent.</p></div>';
}
ICT.kist=function(o){
 reg[o.id]=o;
 var ok=parts(o.key,o.levels),n=ok.filter(Boolean).length,all=n===o.levels.length,date=dateFor(o.id,all),left=o.levels.length-n;
 var list=o.levels.map(function(l,i){return '<li><span class="'+(ok[i]?'y':'n')+'">'+(ok[i]?'✓':'·')+'</span><span>Deel '+(i+1)+': '+esc(l.naam)+(ok[i]?' <span class="muted">(gehaald)</span>':'')+'</span></li>';}).join('');
 var h='<section class="kist" data-kist="'+esc(o.id)+'" aria-label="Sleutel en schatkist"><h2>Sleutel en schatkist</h2>'+
  '<p class="small">'+(all?'Je hebt alle delen van de sleutel.':'Haal elk niveau om een deel van de sleutel te krijgen. Met de hele sleutel open je de schatkist.')+'</p>'+
  '<div class="kist-row">'+keySVG(ok,all)+chestSVG(all)+'</div><ul class="kist-parts">'+list+'</ul>';
 if(all){
  h+='<p class="kist-win">De schatkist is open! Goed gedaan.</p><button type="button" class="ict-btn" data-kist-proof="'+esc(o.id)+'" aria-expanded="'+(!!shown[o.id])+'">'+(shown[o.id]?'Verberg bewijs':'Toon bewijs')+'</button>';
  if(shown[o.id])h+=proofHTML(o,ok,date);
 }else h+='<p class="muted small">Nog '+left+' sleuteldeel'+(left===1?'':'en')+' te gaan.</p>';
 return h+'</section>';
};

/* ---------- gebeurtenissen ---------- */
document.addEventListener('click',function(e){
 var t=e.target.closest?e.target.closest('[data-theme-toggle],[data-style-toggle],[data-kist-proof]'):null;
 if(!t)return;
 if(t.hasAttribute('data-theme-toggle')){toggleTheme();return;}
 if(t.hasAttribute('data-style-toggle')){toggleStyle();return;}
 var id=t.getAttribute('data-kist-proof'),o=reg[id];if(!o)return;
 shown[id]=!shown[id];
 var el=document.querySelector('[data-kist="'+id+'"]');
 if(el){var d=document.createElement('div');d.innerHTML=ICT.kist(o);el.parentNode.replaceChild(d.firstChild,el);
  var nb=document.querySelector('[data-kist-proof="'+id+'"]');if(nb)nb.focus();}
});
document.addEventListener('input',function(e){
 if(e.target&&e.target.id==='kist-naam'){
  var v=e.target.value;set('ict-naam',v);
  [].forEach.call(document.querySelectorAll('[data-kist-name]'),function(n){n.textContent=v||'Jouw naam';});
 }
});
paint();
})();

<script>
(function(){
'use strict';

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function loadBest(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}}
function saveBest(id,n){try{var b=loadBest();if((b[id]||0)<n){b[id]=n;localStorage.setItem(KEY,JSON.stringify(b));}}catch(e){}}
function starTxt(n){return '★★★'.slice(0,n)+'☆☆☆'.slice(0,3-n);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function levelBar(L,cur){var b=loadBest();return '<div class="levels" role="group" aria-label="Niveau">'+L.map(function(l,i){var n=b[l.id]||0;return '<button type="button" class="lv" data-a="lv" data-i="'+i+'" aria-pressed="'+(i===cur)+'">'+(i+1)+'. '+esc(l.naam)+(n?'<span class="st" aria-label="'+n+' van 3 sterren">'+starTxt(n)+'</span>':'')+'</button>';}).join('')+'</div>';}
function toTop(){try{document.getElementById('app').scrollIntoView({block:'start'});}catch(e){}}
function kistOpt(id,naam,L){return {id:id,naam:naam,key:KEY,levels:L.map(function(l){return {id:l.id,naam:l.naam};})};}

var KEY='netwerk-bouwen-beste';
var LEVELS=[
 {id:'thuis',naam:'Thuisnetwerk',txt:'Zorg dat alle apparaten thuis internet hebben.',t:[1,3]},
 {id:'kantoor',naam:'Klein kantoor',txt:'De router heeft te weinig poorten. Wat heb je nodig?',t:[1,3]},
 {id:'school',naam:'Schoolgebouw',txt:'Twee lokalen, vaste pc’s en draadloze apparaten. Bouw het hele netwerk.',t:[2,4]}
];
var TY={
 internet:{n:'Internet'},router:{n:'Router',lan:2,host:1},switch:{n:'Switch',lan:8},ap:{n:'Access point',lan:1,host:1},
 pc:{n:'Pc',lan:1},laptop:{n:'Laptop',lan:1,wifi:1},printer:{n:'Printer',lan:1,wifi:1},server:{n:'Server',lan:1},phone:{n:'Telefoon',wifi:1},tv:{n:'Slimme tv',lan:1,wifi:1}
};
function N(id,t,x,y,o){o=o||{};return {id:id,t:t,x:x,y:y,lan:o.lan!==undefined?o.lan:TY[t].lan||0,nm:o.nm||TY[t].n};}
var MAPS=[
 [N('net','internet',400,50),N('rt','router',400,150,{lan:4}),N('p1','pc',100,400,{nm:'Pc'}),N('l1','laptop',260,400),N('pr','printer',420,400),N('ph','phone',580,400),N('tv','tv',720,400)],
 [N('net','internet',400,40),N('rt','router',400,130,{lan:2}),N('sw','switch',400,260,{lan:8}),
  N('p1','pc',60,430,{nm:'Pc 1'}),N('p2','pc',170,430,{nm:'Pc 2'}),N('p3','pc',280,430,{nm:'Pc 3'}),N('p4','pc',390,430,{nm:'Pc 4'}),N('p5','pc',500,430,{nm:'Pc 5'}),N('sv','server',610,430),N('pr','printer',720,430),
  N('l1','laptop',670,150,{nm:'Laptop 1'}),N('l2','laptop',740,250,{nm:'Laptop 2'})],
 [N('net','internet',400,40),N('rt','router',400,105,{lan:2}),N('s1','switch',170,290,{lan:8,nm:'Switch A'}),N('s2','switch',630,290,{lan:8,nm:'Switch B'}),N('ap','ap',400,215),
  N('a1','pc',50,450,{nm:'Pc A1'}),N('a2','pc',135,450,{nm:'Pc A2'}),N('a3','pc',220,450,{nm:'Pc A3'}),N('a4','pc',305,450,{nm:'Pc A4'}),
  N('b1','pc',495,450,{nm:'Pc B1'}),N('b2','pc',580,450,{nm:'Pc B2'}),N('b3','pc',665,450,{nm:'Pc B3'}),N('pr','printer',750,450),N('sv','server',750,350),
  N('ph1','phone',320,360,{nm:'Telefoon 1'}),N('ph2','phone',400,395,{nm:'Telefoon 2'}),N('l1','laptop',480,360)]
];
var FIX=[['net','rt']];
var S;
function fresh(lv){S={lv:lv,links:[],sel:null,tool:'utp',tests:0,msg:null,res:null,solved:false,stars:0};}
fresh(0);
var app=document.getElementById('app');
function nodes(){return MAPS[S.lv];}
function nd(id){var a=nodes();for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];}
function isHost(n){return !!TY[n.t].host;}
function isClient(n){return !(n.t==='router'||n.t==='switch'||n.t==='ap'||n.t==='internet');}
function utpUsed(id){var c=0;S.links.forEach(function(l){if(l.k==='utp'&&(l.a===id||l.b===id))c++;});return c;}
function anyLinks(id){return S.links.filter(function(l){return l.a===id||l.b===id;}).length;}
function err(t){S.msg={k:'bad',t:t};}
function addLink(a,b,k){
 var A=nd(a),B=nd(b);S.res=null;
 if(a===b)return;
 if(A.t==='internet'||B.t==='internet'){err('Het internet is al verbonden met de router. Daar hoef je niets aan te doen.');return;}
 var ex=S.links.filter(function(l){return (l.a===a&&l.b===b)||(l.a===b&&l.b===a);})[0];
 if(ex){if(ex.k===k){S.links.splice(S.links.indexOf(ex),1);S.msg={k:'ok',t:'Verbinding weggehaald.'};}else err('Deze twee apparaten zijn al verbonden. Klik op de lijn om hem te verwijderen.');return;}
 if(k==='wifi'){
  var host=isHost(A)?A:isHost(B)?B:null,cl=host===A?B:A;
  if(!host||!isClient(cl)||!TY[cl.t].wifi){err('Wifi werkt alleen tussen een router of access point en een apparaat met wifi. Een pc of server heeft meestal geen wifi, die sluit je aan met een kabel.');return;}
  if(anyLinks(cl.id)>0){err(cl.nm+' is al verbonden. Haal eerst de andere verbinding weg.');return;}
 }else{
  if(!A.lan||!B.lan){err((A.lan?B.nm:A.nm)+' heeft geen netwerkpoort. Gebruik wifi.');return;}
  var ends=[A,B];
  for(var i=0;i<2;i++){
   var n=ends[i];
   if(isClient(n)&&anyLinks(n.id)>0){err(n.nm+' is al verbonden. Haal eerst de andere verbinding weg.');return;}
   if(utpUsed(n.id)>=n.lan){err(n.nm+' heeft maar '+n.lan+' poort'+(n.lan===1?'':'en')+' en die zijn al bezet.'+(n.t==='router'?' Een switch geeft je extra poorten.':''));return;}
  }
 }
 S.links.push({a:a,b:b,k:k});
 S.msg={k:'ok',t:(k==='wifi'?'Wifi-verbinding':'Kabel')+' gelegd tussen '+A.nm+' en '+B.nm+'.'};
}
function reach(){
 var seen={net:1},q=['net'];
 var all=S.links.concat(FIX.map(function(f){return {a:f[0],b:f[1]};}));
 while(q.length){var c=q.shift();all.forEach(function(l){var o=l.a===c?l.b:l.b===c?l.a:null;if(o&&!seen[o]){seen[o]=1;q.push(o);}});}
 return seen;
}
function test(){
 S.tests++;
 var r=reach(),bad=nodes().filter(function(n){return !r[n.id];});
 S.res={r:r};
 if(!bad.length){S.solved=true;var t=LEVELS[S.lv].t;S.stars=S.tests<=t[0]?3:S.tests<=t[1]?2:1;saveBest(LEVELS[S.lv].id,S.stars);S.msg=null;}
 else S.msg={k:'bad',t:'<b>Nog niet alles heeft internet.</b> Geen verbinding: '+bad.map(function(n){return esc(n.nm)+(anyLinks(n.id)?' (de keten komt niet bij de router uit)':' (nog niet aangesloten)');}).join(', ')+'.'};
}
function icon(n){
 var t=n.t,s='';
 if(t==='internet')s='<path d="M-24 8a10 10 0 0 1 4-18a14 14 0 0 1 26-3a11 11 0 0 1 20 12a8 8 0 0 1-2 9z" fill="var(--cool)" opacity=".75" stroke="var(--ink)" stroke-width="2"/>';
 else if(t==='router')s='<rect x="-28" y="-8" width="56" height="18" rx="3" fill="var(--slot)" stroke="var(--ink)" stroke-width="2"/><path d="M-14-8l-6-14M14-8l6-14" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/><circle cx="-14" cy="1" r="2.5" fill="var(--ok)"/><circle cx="-5" cy="1" r="2.5" fill="var(--gold)"/>';
 else if(t==='switch')s='<rect x="-30" y="-8" width="60" height="16" rx="2" fill="var(--metal)" stroke="var(--ink)" stroke-width="2"/>'+[0,1,2,3,4,5].map(function(i){return '<rect x="'+(-24+i*8)+'" y="-3" width="5" height="6" fill="var(--slot)"/>';}).join('');
 else if(t==='ap')s='<circle cx="0" cy="0" r="14" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><path d="M-8-3a11 11 0 0 1 16 0M-4 2a6 6 0 0 1 8 0" fill="none" stroke="var(--cool)" stroke-width="2.5" stroke-linecap="round"/><circle cx="0" cy="7" r="2" fill="var(--cool)"/>';
 else if(t==='pc')s='<rect x="-10" y="-20" width="20" height="40" rx="2" fill="var(--casef)" stroke="var(--ink)" stroke-width="2"/><rect x="-6" y="-14" width="12" height="3" fill="var(--slot)"/><circle cx="0" cy="10" r="3" fill="none" stroke="var(--ink)" stroke-width="1.5"/>';
 else if(t==='laptop')s='<rect x="-18" y="-14" width="36" height="22" rx="2" fill="var(--slot)" stroke="var(--ink)" stroke-width="2"/><rect x="-14" y="-10" width="28" height="14" fill="var(--cool)" opacity=".6"/><path d="M-24 14h48" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>';
 else if(t==='printer')s='<rect x="-18" y="-6" width="36" height="18" rx="2" fill="var(--metal)" stroke="var(--ink)" stroke-width="2"/><rect x="-11" y="-16" width="22" height="10" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/><rect x="-11" y="6" width="22" height="9" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>';
 else if(t==='server')s='<rect x="-14" y="-20" width="28" height="40" rx="2" fill="var(--psu)" stroke="var(--ink)" stroke-width="2"/>'+[-12,-2,8].map(function(y){return '<rect x="-10" y="'+y+'" width="20" height="6" fill="var(--slot)"/><circle cx="6" cy="'+(y+3)+'" r="1.5" fill="var(--ok)"/>';}).join('');
 else if(t==='phone')s='<rect x="-9" y="-18" width="18" height="36" rx="4" fill="var(--slot)" stroke="var(--ink)" stroke-width="2"/><rect x="-6" y="-13" width="12" height="22" fill="var(--cool)" opacity=".6"/>';
 else if(t==='tv')s='<rect x="-24" y="-16" width="48" height="28" rx="2" fill="var(--slot)" stroke="var(--ink)" stroke-width="2"/><rect x="-20" y="-12" width="40" height="20" fill="var(--cool)" opacity=".6"/><path d="M-8 18h16" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>';
 return s;
}
function scene(){
 var s='<svg class="scene" viewBox="0 0 800 520" role="group" aria-label="Netwerkschema">';
 FIX.forEach(function(f){var a=nd(f[0]),b=nd(f[1]);s+='<g class="fix"><path class="vis" d="M'+a.x+' '+a.y+'L'+b.x+' '+b.y+'"/></g>';});
 S.links.forEach(function(l,i){var a=nd(l.a),b=nd(l.b);s+='<g class="lk '+l.k+'" data-a="lnk" data-i="'+i+'" role="button" tabindex="0" aria-label="Verbinding tussen '+esc(a.nm)+' en '+esc(b.nm)+', klik om te verwijderen"><path class="hit" d="M'+a.x+' '+a.y+'L'+b.x+' '+b.y+'"/><path class="vis" d="M'+a.x+' '+a.y+'L'+b.x+' '+b.y+'"/></g>';});
 var r=S.res?S.res.r:null;
 nodes().forEach(function(n){
  var cls='nd'+(S.sel===n.id?' sel':'')+(r?(r[n.id]?' ok':' no'):''),sub=n.lan?n.lan+' poort'+(n.lan===1?'':'en')+(isHost(n)?' + wifi':''):(TY[n.t].wifi?'wifi':'');
  s+='<g class="'+cls+'" data-a="nd" data-id="'+n.id+'" role="button" tabindex="0" aria-pressed="'+(S.sel===n.id)+'" aria-label="'+esc(n.nm)+(sub?', '+sub:'')+'" transform="translate('+n.x+' '+n.y+')"><rect class="hl" x="-40" y="-34" width="80" height="78" rx="8"/><g transform="translate(0 -6)">'+icon(n)+'</g><text y="30" text-anchor="middle">'+esc(n.nm)+'</text>'+(sub&&n.t!=='internet'?'<text class="sub" y="41" text-anchor="middle">'+sub+'</text>':'')+'</g>';
 });
 return s+'</svg>';
}
function render(){
 var L=LEVELS[S.lv],used=S.links.length;
 var tips=S.msg?'<div class="tip '+S.msg.k+'">'+S.msg.t+'</div>':(S.solved?'':'<div class="tip">Kies een soort verbinding. Klik op het ene apparaat en daarna op het andere. Klik op een lijn om hem weer weg te halen.</div>');
 var res='';
 if(S.solved)res='<div class="tip ok"><div class="stars" aria-label="'+S.stars+' van 3 sterren">'+starTxt(S.stars)+'</div><b>Het netwerk werkt!</b> Alle apparaten hebben internet. Je testte '+S.tests+' keer.'+(S.stars<3?' Met '+L.t[0]+' test'+(L.t[0]===1?'':'s')+' krijg je 3 sterren.':'')+'</div>'+
  '<ul class="learn">'+(S.lv===0?'<li><b>Router.</b> Geeft alle apparaten toegang tot het internet, met kabel of wifi.</li><li><b>Wifi.</b> Draadloos, handig voor laptops en telefoons.</li>':S.lv===1?'<li><b>Switch.</b> Geeft extra netwerkpoorten, zodat veel apparaten met een kabel kunnen aansluiten.</li>':'<li><b>Access point.</b> Zorgt voor wifi in een gebouw. Het zit met een kabel aan het netwerk.</li><li><b>Meerdere switches.</b> Je kunt switches aan elkaar koppelen om meer lokalen te bedienen.</li>')+'</ul>'+
  (S.lv<LEVELS.length-1?'<button type="button" class="ict-btn" data-a="next">Volgend netwerk</button>':'');
 app.innerHTML='<div class="intro"><div><p class="kicker">Netwerk</p><h1>Netwerk bouwen</h1><p class="small muted">'+esc(L.txt)+'</p></div>'+levelBar(LEVELS,S.lv)+'</div>'+
  '<div class="game"><div class="scenebox">'+scene()+'</div><div class="panel">'+
  '<div class="tools" role="group" aria-label="Soort verbinding"><button type="button" class="tool" data-a="tool" data-k="utp" aria-pressed="'+(S.tool==='utp')+'"><svg viewBox="0 0 34 10" aria-hidden="true"><path d="M0 5h34" stroke="var(--ink)" stroke-width="3"/></svg>Kabel (UTP)</button><button type="button" class="tool" data-a="tool" data-k="wifi" aria-pressed="'+(S.tool==='wifi')+'"><svg viewBox="0 0 34 10" aria-hidden="true"><path d="M0 5h34" stroke="var(--cool)" stroke-width="3" stroke-dasharray="3 6" stroke-linecap="round"/></svg>Wifi</button></div>'+
  '<div class="count"><span>Verbindingen: <b>'+used+'</b></span><span class="muted small">Tests: <b>'+S.tests+'</b></span></div>'+
  '<div class="count"><button type="button" class="ict-btn" data-a="test"'+(S.solved?' disabled':'')+'>Test het netwerk</button><button type="button" class="btn" data-a="clear"'+(S.solved?' disabled':'')+'>Alles wissen</button></div>'+
  '<div class="tips" aria-live="polite">'+tips+'</div>'+res+'</div></div>'+ICT.kist(kistOpt('netwerk-bouwen','Netwerk bouwen',LEVELS));
 ICT.paintTheme&&ICT.paintTheme();
}
var act={
 lv:function(el){fresh(+el.getAttribute('data-i'));render();},
 tool:function(el){S.tool=el.getAttribute('data-k');S.sel=null;render();},
 nd:function(el){
  if(S.solved)return;
  var id=el.getAttribute('data-id');
  if(!S.sel){S.sel=id;S.msg={k:'ok',t:'Gekozen: <b>'+esc(nd(id).nm)+'</b>. Klik nu op het apparaat waarmee je het wilt verbinden.'};}
  else if(S.sel===id){S.sel=null;S.msg=null;}
  else{var a=S.sel;S.sel=null;S.msg=null;addLink(a,id,S.tool);}
  render();var f=app.querySelector('.nd[data-id="'+id+'"]');if(f)f.focus();
 },
 lnk:function(el){if(S.solved)return;S.links.splice(+el.getAttribute('data-i'),1);S.res=null;S.msg={k:'ok',t:'Verbinding weggehaald.'};render();},
 test:function(){test();render();var f=app.querySelector('[data-a="next"]');if(f)f.focus();},
 clear:function(){S.links=[];S.sel=null;S.res=null;S.msg=null;render();},
 next:function(){fresh(Math.min(S.lv+1,LEVELS.length-1));render();toTop();}
};
document.addEventListener('click',function(e){var el=e.target.closest?e.target.closest('[data-a]'):null;if(!el||!app.contains(el))return;var f=act[el.getAttribute('data-a')];if(f)f(el);});
document.addEventListener('keydown',function(e){var t=e.target;if((e.key==='Enter'||e.key===' ')&&t&&t.getAttribute&&t.getAttribute('role')==='button'&&t.getAttribute('data-a')){e.preventDefault();var f=act[t.getAttribute('data-a')];if(f)f(t);}if(e.key==='Escape'&&S.sel){S.sel=null;S.msg=null;render();}});
window.__NW={get S(){return S;},fresh:fresh,render:render,addLink:addLink,test:test,nodes:nodes};
window.addEventListener('ict-theme',render);
render();

})();
</script>
