<!doctype html>
<html lang="nl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>PC Bouwlab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Concept: een werkbank met antistatische mat. Links de bouwtekening van het moederbord, rechts het stappenpaneel. Koper is de enige accentkleur. */
:root{
  --bg:#e8eee7; --grid:#d0dcd2; --surface:#f5f8f3; --ink:#15221c; --muted:#556860; --line:#b4c4b8;
  --copper:#b85a22; --on-copper:#ffffff; --ok:#1d7447; --bad:#b0342a; --warn:#a56a10;
  --pcb:#1f5e4a; --pcb-d:#143f31; --metal:#aab5ae; --metal2:#8d9a93; --slot:#0f1d18; --gold:#d6a62c;
  --ram:#2f6aa8; --ssd:#7a4ea0; --psu:#3a4742; --case:#6a7b72; --casefill:#dde6dc; --gpu:#2c3531; --cpu:#c9d2cc;
  --c1:#c9962a; --c2:#2f6aa8; --c3:#8b52b8; --c4:#d0642a; --c5:#2a8a6a; --c6:#b0342a; --c7:#6a7b72;
  --disp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111b17; --grid:#1a2a24; --surface:#192520; --ink:#e4eee8; --muted:#8fa69b; --line:#2f433a;
    --copper:#e58f55; --on-copper:#1b110a; --ok:#58c88c; --bad:#f0796c; --warn:#e3ab4c;
    --pcb:#2f7d64; --pcb-d:#1f5646; --metal:#6d7b74; --metal2:#55645d; --slot:#070d0b; --gold:#e4b94d;
    --ram:#5b9ae0; --ssd:#a67dd0; --psu:#46544e; --case:#4d6057; --casefill:#14201b; --gpu:#3a4640; --cpu:#aab6af;
    --c1:#e0b04a; --c2:#5b9ae0; --c3:#b283dc; --c4:#e8804a; --c5:#4cb894; --c6:#f0796c; --c7:#8fa69b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111b17; --grid:#1a2a24; --surface:#192520; --ink:#e4eee8; --muted:#8fa69b; --line:#2f433a;
  --copper:#e58f55; --on-copper:#1b110a; --ok:#58c88c; --bad:#f0796c; --warn:#e3ab4c;
  --pcb:#2f7d64; --pcb-d:#1f5646; --metal:#6d7b74; --metal2:#55645d; --slot:#070d0b; --gold:#e4b94d;
  --ram:#5b9ae0; --ssd:#a67dd0; --psu:#46544e; --case:#4d6057; --casefill:#14201b; --gpu:#3a4640; --cpu:#aab6af;
  --c1:#e0b04a; --c2:#5b9ae0; --c3:#b283dc; --c4:#e8804a; --c5:#4cb894; --c6:#f0796c; --c7:#8fa69b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background-color:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);
  padding-inline:16px;padding-block:0 120px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--copper);outline-offset:2px}
.wrap{max-width:1040px;margin-inline:auto}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:13px}
.bad{color:var(--bad)}.okc{color:var(--ok)}

/* kop */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap;padding-block:18px}
.lft{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.back{font-size:13px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
.back:hover{color:var(--copper);border-color:var(--copper)}
.brand{background:none;border:0;padding:0;cursor:pointer;font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:.06em;text-transform:uppercase}
.brand span{color:var(--copper)}
.phases{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.phases li{font-size:13px;padding:4px 10px;border:1.5px solid var(--line);color:var(--muted);background:var(--surface)}
.phases li.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.phases li.done{border-color:var(--ok);color:var(--ok)}

h1,h2,h3{text-wrap:balance}
h1{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:clamp(46px,9vw,88px);line-height:.92;letter-spacing:.005em;margin:0 0 18px}
h2{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:28px;letter-spacing:.02em;line-height:1.05;margin:0 0 10px}
h3{font-size:16px;margin:0 0 4px}
p{margin:0 0 12px}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.lead{font-size:18px;max-width:58ch}

/* start */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,230px);gap:32px;align-items:center;padding-block:20px 36px}
.hero-art{width:100%;max-width:230px;height:auto;justify-self:end}
@media (max-width:640px){.hero{grid-template-columns:minmax(0,1fr)}.hero-art{justify-self:start;max-width:150px}}
.briefs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px;margin-block:14px 24px}
.brief{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--ink);padding:16px;cursor:pointer;min-width:0}
.brief:hover{border-color:var(--copper);box-shadow:inset 0 0 0 1px var(--copper)}
.brief .q{color:var(--muted);font-size:15px;margin:0}
.brief-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brief-h b{font-family:var(--disp);font-size:26px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.lvl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.budget{font-size:22px;font-weight:500}
.stars{letter-spacing:.15em;color:var(--copper);font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:12px;padding:2px 7px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.toggle{display:flex;gap:10px;align-items:flex-start;max-width:60ch;cursor:pointer}
.toggle input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--copper);flex:none}
.toggle small{display:block;color:var(--muted)}

/* knoppen */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border:1.5px solid var(--copper);background:var(--copper);color:var(--on-copper);font-weight:600;cursor:pointer;border-radius:3px}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}

/* kiezen */
.pick{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:start}
@media (min-width:900px){.pick{grid-template-columns:minmax(0,1fr) 340px}.side{position:sticky;top:16px}}
.brief-card{background:var(--surface);border:1.5px solid var(--ink);padding:16px;margin-bottom:18px}
.brief-card .q{font-size:17px;margin-bottom:10px}
.req{display:flex;flex-wrap:wrap;gap:6px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tab{background:var(--surface);border:1.5px solid var(--line);padding:8px 12px;cursor:pointer;min-height:42px;border-radius:3px}
.tab[aria-pressed="true"]{border-color:var(--ink);font-weight:600;box-shadow:inset 0 -3px 0 var(--copper)}
.tab .tick{color:var(--ok);margin-left:4px}
.blurb{color:var(--muted);max-width:62ch;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.opt{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1.5px solid var(--line);padding:12px;cursor:pointer;min-width:0;border-radius:3px}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--copper);box-shadow:inset 0 0 0 1.5px var(--copper)}
.opt-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.opt-h b{font-weight:600;overflow-wrap:anywhere}
.price{font-family:var(--mono);font-weight:500;white-space:nowrap}
.flag{font-size:13px;color:var(--bad)}
.card{background:var(--surface);border:1.5px solid var(--line);padding:14px;margin-bottom:14px}
.meter{height:10px;background:var(--line);margin-block:8px 4px}
.meter i{display:block;height:100%;background:var(--ok);max-width:100%}
.meter.over i{background:var(--bad)}
.meter.pw{position:relative;margin-block:10px 6px}
.meter.pw b{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;background:var(--ink)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.list li{display:flex;gap:8px;justify-content:space-between;align-items:baseline;font-size:14px;min-width:0}
.list li span:first-child{min-width:0;overflow-wrap:anywhere}
.row-ok{color:var(--ok)}.row-bad{color:var(--bad)}.row-n{color:var(--muted)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}
.checks li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px}
.verdict{border:2px solid var(--bad);background:var(--surface);padding:14px;margin-bottom:14px}
.verdict ul{margin:8px 0 0;padding-left:18px;display:grid;gap:6px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1.5px solid var(--ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:1040px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar-t{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bar-t strong{font-size:22px;font-weight:500}

/* bouwen */
.build{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:860px){.build{grid-template-columns:minmax(0,420px) minmax(0,1fr)}.scenebox{position:sticky;top:16px}}
.scenebox{border:1.5px solid var(--ink);background:var(--surface);max-width:440px}
.scene{display:block;width:100%;height:auto}
.panel{background:var(--surface);border:1.5px solid var(--ink);padding:18px;min-width:0}
.msgbox{min-height:4px}
.msg{border-left:4px solid var(--line);background:var(--bg);padding:10px 12px;margin-block:12px}
.msg.ok{border-color:var(--ok)}.msg.bad{border-color:var(--bad)}
.tip{color:var(--muted);font-size:14px}
.stepgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px;margin-block:12px}
.stepbtn{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--bg);border:1.5px solid var(--line);padding:10px 12px;cursor:pointer;min-width:0;border-radius:3px}
.stepbtn:hover{border-color:var(--copper)}
.stepbtn b{font-weight:600}
.stepbtn span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.done-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.done-list .chip{color:var(--ok);border-color:var(--ok)}
.act{display:flex;flex-wrap:wrap;gap:10px;margin-block:14px 4px}
.optlist{display:grid;gap:8px;margin-block:12px}
.choice{text-align:left;background:var(--bg);border:1.5px solid var(--line);padding:11px 13px;cursor:pointer;border-radius:3px}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice:disabled{opacity:.55;cursor:not-allowed;text-decoration:line-through}
.ordbtn{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:1.5px solid var(--line);padding:11px 13px;cursor:pointer;border-radius:3px}
.ordbtn .n{font-family:var(--mono);min-width:22px;height:22px;display:inline-grid;place-items:center;border:1.5px solid var(--line);font-size:12px;flex:none}
.ordbtn.d{border-color:var(--ok)}
.ordbtn.d .n{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.cab{display:flex;gap:10px;align-items:center;text-align:left;background:var(--bg);border:1.5px solid var(--line);padding:10px 12px;cursor:pointer;border-radius:3px}
.cab i{width:14px;height:14px;flex:none;border-radius:50%}
.cab[aria-pressed="true"]{border-color:var(--copper);box-shadow:inset 0 0 0 1.5px var(--copper)}
.cab.d{border-color:var(--ok);color:var(--muted)}
.post{font-family:var(--mono);font-size:13px;background:#0b130f;color:#9be3b5;padding:14px;margin:12px 0;overflow-x:auto;line-height:1.55;white-space:pre}
.post span{display:block;opacity:0;animation:ln .01s forwards}
@keyframes ln{to{opacity:1}}

/* tekening */
.sc-pcb{fill:var(--pcb);stroke:var(--pcb-d);stroke-width:2}
.sc-metal{fill:var(--metal)}.sc-metal2{fill:var(--metal2)}
.sc-slot{fill:var(--slot)}
.sc-gold{fill:var(--gold)}
.sc-sock{fill:var(--slot);stroke:var(--metal2);stroke-width:2}
.sc-cpu{fill:var(--cpu);stroke:var(--metal2);stroke-width:1.5}
.sc-fan{fill:var(--gpu)}
.sc-blade{fill:var(--metal)}
.sc-hub{fill:var(--gold)}
.sc-ram{fill:var(--ram)}
.sc-chip{fill:var(--slot);opacity:.7}
.sc-ssd{fill:var(--ssd)}
.sc-port{fill:var(--slot);stroke:var(--metal);stroke-width:1}
.sc-chipset{fill:var(--metal2)}
.sc-gpu{fill:var(--gpu);stroke:var(--metal2);stroke-width:1.5}
.sc-gfan{fill:var(--slot);stroke:var(--metal2);stroke-width:1}
.sc-psu{fill:var(--psu);stroke:var(--ink);stroke-width:1.5}
.sc-case{fill:var(--casefill);stroke:var(--case);stroke-width:3}
.sc-foot{fill:none;stroke:var(--copper);stroke-width:1.5;stroke-dasharray:5 4}
.sc-so{fill:var(--gold)}.sc-sh{fill:var(--slot)}
.sc-ring{fill:none;stroke:var(--case);stroke-width:1.5}
.sc-screw{fill:var(--metal);stroke:var(--slot);stroke-width:1}
.sc-t{font-family:var(--mono);font-size:9px;fill:var(--muted);letter-spacing:.08em}
.sc-t2{font-family:var(--mono);font-size:9px;fill:#fff}
.sc-lab{font-family:var(--mono);font-size:9px;fill:#fff}
.sc-num{font-family:var(--mono);font-size:9px;fill:#fff}
.sc-cable{fill:none;stroke-width:3.5;stroke-linecap:round}
.target{fill:none;stroke:var(--copper);stroke-width:2;stroke-dasharray:5 3}
.hot{fill:transparent;stroke:var(--copper);stroke-width:1.5;stroke-dasharray:4 3;cursor:pointer}
.hot:hover,.hot:focus-visible{fill:var(--copper);fill-opacity:.35;outline:none}
.hot.sel{fill:var(--copper);fill-opacity:.55;stroke-dasharray:none}
.hot.dn{display:none}
@media (prefers-reduced-motion:no-preference){
  .hot,.target{animation:dash 1.2s linear infinite}
  .hot.sel{animation:none}
  @keyframes dash{to{stroke-dashoffset:-14}}
}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px;margin-block:14px}
.badge{border:1.5px solid var(--line);padding:12px;background:var(--bg)}
.badge.on{border-color:var(--copper)}
.badge .stars{display:block;margin-bottom:4px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:last-child{text-align:right;font-family:var(--mono);white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.learn{padding-left:18px;display:grid;gap:6px;max-width:64ch}
</style>

<div class="wrap" id="app"></div>

<script>/*SHARED:START*/
(function(){
'use strict';
var ICT=window.ICT=window.ICT||{};
function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function set(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

/* ---------- stijl voor de gedeelde onderdelen ---------- */
var css=''+
':root{--wood:#8a5a2b;--wood2:#6e451f}'+
'@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--wood:#b27a42;--wood2:#8d5f31}}'+
':root[data-theme="dark"]{--wood:#b27a42;--wood2:#8d5f31}'+
'.ict-theme{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--body);cursor:pointer;border-radius:3px}'+
'.ict-theme:hover{border-color:var(--copper);color:var(--copper)}'+
'.kist{background:var(--surface);border:1.5px solid var(--ink);padding:18px;display:grid;gap:14px;min-width:0;margin-top:20px}'+
'.kist h2{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:24px;letter-spacing:.02em;line-height:1.05;margin:0}'+
'.kist p{margin:0}'+
'.kist .muted{color:var(--muted)}.kist .small{font-size:14px}'+
'.kist-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:22px;align-items:center}'+
'@media (max-width:620px){.kist-row{grid-template-columns:minmax(0,1fr)}.kist-row .kchest{max-width:260px;margin:0 auto}}'+
'.kkey{position:relative;aspect-ratio:1000/349;width:100%;max-width:520px;overflow:hidden;border:1.5px solid var(--ink);background:#14100c}'+
'.kkey img{position:absolute;inset:0;width:100%;height:100%;display:block;max-width:none}'+
'.kkey .ghost{filter:brightness(.3) saturate(.3)}'+
'.kkey .kp{opacity:0;transition:opacity .7s ease}.kkey .kp.on{opacity:1}'+
'.kkey .p1{clip-path:inset(0 60.4% 0 0)}.kkey .p2{clip-path:inset(0 35% 0 39.6%)}.kkey .p3{clip-path:inset(0 0 0 65%)}'+
'.kkey .kn{position:absolute;top:50%;transform:translate(-50%,-50%);font:600 22px/1 var(--mono);color:#cbb27a;opacity:.85;pointer-events:none}.kkey .kn.on{display:none}'+
'.kkey .kd{position:absolute;top:8%;bottom:8%;width:0;border-left:1.5px dashed rgba(203,178,122,.45);pointer-events:none}'+
'.kchest{position:relative;aspect-ratio:560/443;width:100%;max-width:300px}'+
'.kchest img{position:absolute;inset:0;width:100%;height:100%;display:block;max-width:none;z-index:1;transform-origin:50% 95%}'+
'.kchest .o{opacity:0}.kchest.open .o{opacity:1}.kchest.open .c{opacity:0}'+
'.kchest::before{content:"";position:absolute;inset:-14%;background:radial-gradient(closest-side,rgba(255,196,80,.5),rgba(255,196,80,0));opacity:0;transition:opacity .8s}.kchest.open::before{opacity:1}'+
'.kchest.pop .o{animation:kpop .9s ease-out}'+
'@keyframes kpop{0%{transform:scale(.93) translateY(8px)}55%{transform:scale(1.05) translateY(-4px)}100%{transform:none}}'+
'.ksp{position:absolute;z-index:2;color:#ffd978;font-size:20px;line-height:1;opacity:0;pointer-events:none}.kchest.open .ksp{animation:ktw 2.4s ease-in-out infinite}'+
'@keyframes ktw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}'+
'@media (prefers-reduced-motion:reduce){.kchest.pop .o,.kchest.open .ksp{animation:none}.kkey .kp,.kchest::before{transition:none}.kchest.open .ksp{opacity:.8}}'+
'.kist-parts{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:15px}'+
'.kist-parts li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px}'+
'.kist-parts .y{color:var(--ok)}.kist-parts .n{color:var(--muted)}'+
'.kist-win{font-weight:600;color:var(--ok)}'+
'.ict-btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 18px;border:1.5px solid var(--copper);background:var(--copper);color:var(--on-copper);font:600 15px var(--body);cursor:pointer;border-radius:3px;justify-self:start}'+
'.ict-btn:hover{filter:brightness(1.07)}'+
'.proof{border:2px solid var(--gold);background:var(--bg);padding:18px;display:grid;gap:8px}'+
'.proof .kk{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}'+
'.proof .pname{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:clamp(30px,6vw,48px);line-height:1;margin:0;overflow-wrap:anywhere}'+
'.proof label{font-size:14px;font-weight:600}'+
'.proof input{font:400 16px var(--body);padding:8px 10px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);max-width:320px;border-radius:3px}'+
'.proof .small{font-size:14px;color:var(--muted)}'+
'@media (prefers-reduced-motion:no-preference){.twinkle{animation:tw 1.8s ease-in-out infinite}.twinkle.b{animation-delay:.6s}.twinkle.c{animation-delay:1.1s}@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}}';

var root=document.documentElement;

 else{root.removeAttribute('data-style');if(!get('ict-theme'))root.removeAttribute('data-theme');}
}
applyStyle(get('ict-stijl'));
function isRpg(){return root.getAttribute('data-style')==='rpg';}
function sysDark(){try{return window.matchMedia('(prefers-color-scheme: dark)').matches;}catch(e){return false;}}
function isDark(){var t=root.getAttribute('data-theme');return t==='dark'?true:t==='light'?false:sysDark();}
var MOON='<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>';

var SWORD='<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M14.5 3H21v6.5L10 20.5l-2-2 1-3-3.5 1.5-2-2L7 12l-3.5-3.5 2-2L9 8l1-3z" fill="currentColor" opacity=".0"/><path d="M20 4l-9.5 9.5 1.5 1.5L21.500 5.500V3h-1.500zM8 14l-3 3 2 2 3-3zM4 20l2-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';
var PAGE='<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.500 8h7M8.500 12h7M8.500 16h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function styleInner(){var r=isRpg();return (r?PAGE:SWORD)+'<span>'+(r?'Gewone versie':'RPG-versie')+'</span>';}
function styleLabel(){return isRpg()?'Schakel terug naar de gewone versie':'Schakel naar de RPG-versie';}
ICT.themeBtn=function(){var d=isDark(),r=isRpg();return '<button type="button" class="ict-theme" data-theme-toggle aria-pressed="'+d+'" aria-label="'+(d?'Schakel naar lichte modus':'Schakel naar donkere modus')+'">'+btnInner()+'</button> <button type="button" class="ict-theme" data-style-toggle aria-pressed="'+r+'" aria-label="'+styleLabel()+'">'+styleInner()+'</button>';};
function paint(){
 var d=isDark(),r=isRpg();
 [].forEach.call(document.querySelectorAll('[data-theme-toggle]'),function(b){
  b.setAttribute('aria-pressed',String(d));b.setAttribute('aria-label',d?'Schakel naar lichte modus':'Schakel naar donkere modus');b.innerHTML=btnInner();
  var n=b.nextElementSibling;
  if(!(n&&n.hasAttribute&&n.hasAttribute('data-style-toggle'))){n=document.createElement('button');n.type='button';n.className=b.className;n.setAttribute('data-style-toggle','');b.parentNode.insertBefore(n,b.nextSibling);b.parentNode.insertBefore(document.createTextNode(' '),n);}
 });
 [].forEach.call(document.querySelectorAll('[data-style-toggle]'),function(n){n.setAttribute('aria-pressed',String(r));n.setAttribute('aria-label',styleLabel());n.innerHTML=styleInner();});
}

}

var reduce=function(){try{return window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}};
function playOpen(ch){
 var row=ch.parentNode,key=row&&row.querySelector('.kkey');
 if(!key||reduce()||!key.animate){ch.classList.add('open');return;}
 var kr=key.getBoundingClientRect(),cr=ch.getBoundingClientRect(),sx=window.pageXOffset,sy=window.pageYOffset;
 var cl=key.cloneNode(true);
 cl.style.cssText='position:absolute;left:'+(kr.left+sx)+'px;top:'+(kr.top+sy)+'px;width:'+kr.width+'px;height:'+kr.height+'px;margin:0;z-index:9999;pointer-events:none;max-width:none;box-shadow:0 0 28px rgba(255,200,90,.7)';
 document.body.appendChild(cl);
 var dx=(cr.left+cr.width/2)-(kr.left+kr.width/2),dy=(cr.top+cr.height*.55)-(kr.top+kr.height/2);
 var a=cl.animate([
  {transform:'translate(0,0) scale(1) rotate(0)',opacity:1},
  {transform:'translate(0,-14px) scale(1.04) rotate(0)',opacity:1,offset:.18},
  {transform:'translate('+dx+'px,'+dy+'px) scale(.2) rotate(-22deg)',opacity:.0}
 ],{duration:1300,easing:'cubic-bezier(.5,0,.3,1)',fill:'forwards'});
 var done=function(){if(cl.parentNode)cl.parentNode.removeChild(cl);ch.classList.add('pop');ch.classList.add('open');};
 a.onfinish=done;a.oncancel=done;
}
var io=null,scanQ=false;
function scan(){
 scanQ=false;
 var list=document.querySelectorAll('[data-kplay]:not([data-kseen])');
 if(!list.length)return;
 if(!('IntersectionObserver' in window)){[].forEach.call(list,function(e){e.setAttribute('data-kseen','1');played[e.getAttribute('data-kplay')]=true;e.classList.add('open');});return;}
 if(!io)io=new IntersectionObserver(function(es){es.forEach(function(en){
  if(!en.isIntersecting)return;io.unobserve(en.target);
  var id=en.target.getAttribute('data-kplay');played[id]=true;en.target.removeAttribute('data-kplay');
  setTimeout(function(){playOpen(en.target);},350);
 });},{threshold:.6});
 [].forEach.call(list,function(e){e.setAttribute('data-kseen','1');io.observe(e);});
}
function queueScan(){if(scanQ)return;scanQ=true;(window.requestAnimationFrame||setTimeout)(scan);}
try{new MutationObserver(queueScan).observe(document.documentElement,{childList:true,subtree:true});}catch(e){}
document.addEventListener('DOMContentLoaded',queueScan);window.addEventListener('load',queueScan);

  '<p class="small">Behaald op '+esc(date)+'. Sleuteldelen: '+o.levels.map(function(l){return esc(l.naam);}).join(', ')+'.</p>'+

  '<p class="small">Maak een schermafbeelding van dit bewijs en lever die in bij je docent.</p></div>';
}
ICT.kist=function(o){
 reg[o.id]=o;
 var ok=parts(o.key,o.levels),n=ok.filter(Boolean).length,all=n===o.levels.length,date=dateFor(o.id,all),left=o.levels.length-n;
 var list=o.levels.map(function(l,i){return '<li><span class="'+(ok[i]?'y':'n')+'">'+(ok[i]?'✓':'·')+'</span><span>Deel '+(i+1)+': '+esc(l.naam)+(ok[i]?' <span class="muted">(gehaald)</span>':'')+'</span></li>';}).join('');
 var h='<section class="kist" data-kist="'+esc(o.id)+'" aria-label="Sleutel en schatkist"><h2>Sleutel en schatkist</h2>'+
  '<p class="small">'+(all?'Je hebt alle delen van de sleutel.':'Haal elk niveau om een deel van de sleutel te krijgen. Met de hele sleutel open je de schatkist.')+'</p>'+
  '<div class="kist-row">'+keyHTML(ok)+chestHTML(all&&played[o.id],all&&!played[o.id],o.id)+'</div><ul class="kist-parts">'+list+'</ul>';
 if(all){
  h+='<p class="kist-win">De schatkist is open! Goed gedaan.</p><button type="button" class="ict-btn" data-kist-replay="'+esc(o.id)+'">Open de kist opnieuw</button> <button type="button" class="ict-btn" data-kist-proof="'+esc(o.id)+'" aria-expanded="'+(!!shown[o.id])+'">'+(shown[o.id]?'Verberg bewijs':'Toon bewijs')+'</button>';
  if(shown[o.id])h+=proofHTML(o,ok,date);
 }else h+='<p class="muted small">Nog '+left+' sleuteldeel'+(left===1?'':'en')+' te gaan.</p>';
 return h+'</section>';
};

/* ---------- gebeurtenissen ---------- */
document.addEventListener('click',function(e){
 var t=e.target.closest?e.target.closest('[data-theme-toggle],[data-style-toggle],[data-kist-proof],[data-kist-replay]'):null;

 var id=t.getAttribute('data-kist-proof'),o=reg[id];if(!o)return;
 shown[id]=!shown[id];
 var el=document.querySelector('[data-kist="'+id+'"]');
 if(el){var d=document.createElement('div');d.innerHTML=ICT.kist(o);el.parentNode.replaceChild(d.firstChild,el);
  var nb=document.querySelector('[data-kist-proof="'+id+'"]');if(nb)nb.focus();}
});

 }
});
paint();
})();

  row('Koeler en processor',['cooler','cpu'],function(){return p.cooler.w>=p.cpu.w?[true,'De koeler kan '+p.cooler.w+' W aan (processor: '+p.cpu.w+' W).']:[false,'Deze koeler kan '+p.cooler.w+' W aan, de '+p.cpu.name+' gebruikt tot '+p.cpu.w+' W. Hij gaat te heet worden.'];}),
  row('Voeding',['psu','cpu','gpu'],function(){var n=psuNeed(p);return p.psu.w>=n?[true,p.psu.w+' W is genoeg (advies minimaal '+n+' W).']:[false,'Voor deze combinatie is minimaal '+n+' W nodig. Deze voeding levert '+p.psu.w+' W.'];}),

 ];

/* ---------- onderdelen kiezen ---------- */

 var cat=CATS.filter(function(c){return c.id===S.cat;})[0];
 var rq=reqs(p,b),ck=compat(p);

 for(var i=0;i<4;i++)s+='<rect class="sc-slot" x="5" y="'+(30+i*21)+'" width="18" height="14" rx="2"/>';
 s+='<rect class="sc-metal" x="36" y="44" width="44" height="100" rx="3"/><rect class="sc-metal" x="86" y="10" width="96" height="26" rx="3"/>';
 s+='<rect class="sc-sock" x="94" y="64" width="72" height="72" rx="3"/><path class="sc-gold" d="'+['M98 68h12l-12 12z','M162 68h-12l12 12z','M162 132h-12l12-12z','M98 132h12l-12-12z'][S.A.cpuTarget]+'"/>';
 s+='<rect class="sc-port" x="196" y="8" width="34" height="14"/><rect class="sc-port" x="106" y="148" width="24" height="10"/><rect class="sc-port" x="268" y="190" width="14" height="64"/>';
 /* RAM */
 for(var r=0;r<4;r++){
  var on=(id==='ram'&&M.sel.indexOf(r)>=0);
  s+='<rect class="sc-slot" x="'+(196+18*r)+'" y="40" width="12" height="140" rx="1" '+(on?'style="fill:var(--copper)"':'')+'/>';
  s+='<text class="sc-t" x="'+(196+18*r+6)+'" y="34" text-anchor="middle">'+(r+1)+'</text>';
 }
 if(d.ram)[1,3].forEach(function(r){
  s+='<rect class="sc-ram" x="'+(196+18*r)+'" y="40" width="12" height="140" rx="1"/>';
  for(var k=0;k<4;k++)s+='<rect class="sc-chip" x="'+(198+18*r)+'" y="'+(52+k*30)+'" width="8" height="18"/>';
 });
 /* M.2 */
 s+='<rect class="sc-slot" x="40" y="172" width="112" height="12"/>';
 if(d.ssd||(id==='ssd'&&M.next>=2)){s+='<rect class="sc-ssd" x="44" y="170" width="100" height="16" rx="2"/><circle cx="148" cy="178" r="3" class="sc-screw"/>';}
 else if(id==='ssd'&&M.next===1){s+='<rect class="sc-ssd" x="44" y="168" width="100" height="14" rx="2" transform="rotate(-6 44 176)"/>';}
 /* PCIe */
 slotsOf(L).forEach(function(sl,i){s+='<rect class="sc-slot" x="'+sl.x+'" y="'+sl.y+'" width="'+sl.w+'" height="10"/><text class="sc-num" x="14" y="'+(sl.y+9)+'">'+(i+1)+'</text>';});
 s+='<rect class="sc-chipset" x="206" y="200" width="40" height="40" rx="3"/>';
 var hy=L.H-26;
 s+='<rect class="sc-port" x="30" y="'+hy+'" width="34" height="12"/><rect class="sc-port" x="78" y="'+hy+'" width="26" height="12"/><rect class="sc-port" x="118" y="'+hy+'" width="44" height="12"/><rect class="sc-port" x="176" y="'+hy+'" width="20" height="12"/>';
 /* CPU */
 if(d.cpu||id==='cpu'){
  var rot=(id==='cpu'&&!d.cpu)?M.rot:S.A.cpuTarget*90;
  s+='<g transform="rotate('+rot+' 130 100)"><rect class="sc-cpu" x="103" y="73" width="54" height="54" rx="3"/><path class="sc-gold" d="M106 76h10l-10 10z"/><rect x="116" y="86" width="28" height="28" fill="none" stroke="var(--metal2)" stroke-width="1"/></g>';
 }
 /* koeler */
 if(d.cooler){
  var rr=p.cooler.box?38:46;
  s+='<circle cx="130" cy="100" r="'+rr+'" class="sc-metal2"/><circle cx="130" cy="100" r="'+(rr-8)+'" class="sc-fan"/>';
  for(var k2=0;k2<5;k2++)s+='<path class="sc-blade" d="M130 100q10-8 8-'+(rr-12)+'q-14 8-8 '+(rr-12)+'z" transform="rotate('+(k2*72)+' 130 100)"/>';
  s+='<circle cx="130" cy="100" r="5" class="sc-hub"/>';
 }
 /* videokaart */
 if(d.gpu){
  var cw=Math.round(p.gpu.len*0.62),n=cw>170?3:2;
  s+='<rect class="sc-gpu" x="22" y="186" width="'+cw+'" height="44" rx="3"/>';
  for(var f=0;f<n;f++)s+='<circle class="sc-gfan" cx="'+(22+cw/(n*2)+f*(cw/n))+'" cy="208" r="15"/>';
  s+='<rect class="sc-port" x="'+(22+cw-34)+'" y="182" width="26" height="8"/>';
 }
 if(id==='gpu'&&!d.gpu){}
 return s;
}

/* ---------- montage: scherm ---------- */
function viewBuild(){
 var A=S.A,p=S.picks;
 var body;
 if(A.finished)body=panelFinish();
 else if(A.M)body=panelMini();
 else body=panelPick();
 return shell('<div class="build"><div class="scenebox">'+scene()+'</div><div class="panel">'+body+'</div></div>',1);
}
function msgBox(){var m=S.A.msg;return '<div class="msgbox" aria-live="polite">'+(m?'<div class="msg '+m.kind+'">'+m.text+'</div>':'')+'</div>';}
function head(extra){
 var A=S.A,n=A.steps.length,k=A.steps.filter(function(s){return A.done[s.id];}).length;
 return '<p class="kicker mono">Stap '+Math.min(k+1,n)+' van '+n+' · foutjes: '+A.mistakes+'</p>';
}
function panelPick(){
 var A=S.A;
 var rest=A.shuf.filter(function(id){return !A.done[id];}).map(function(id){return A.steps.filter(function(s){return s.id===id;})[0];});
 var done=A.steps.filter(function(s){return A.done[s.id];});
 return head()+'<h2>Wat bouw je nu?</h2>'+
  '<p class="tip">Een pc bouw je in drie rondes: eerst op het bord (buiten de behuizing), dan in de behuizing, en als laatste de kabels. Kies wat nu aan de beurt is.</p>'+msgBox()+
  '<div class="stepgrid">'+rest.map(function(s){return '<button class="stepbtn" data-a="step" data-id="'+s.id+'" data-fk="s-'+s.id+'"><b>'+s.t+'</b><span>'+s.part+'</span></button>';}).join('')+'</div>'+
  (done.length?'<p class="kicker mono" style="margin-top:16px">Klaar</p><div class="done-list">'+done.map(function(s){return '<span class="chip">✓ '+s.t+'</span>';}).join('')+'</div>':'');
}
function panelMini(){
 var A=S.A,M=A.M,p=S.picks,inf=info(M.id,p);
 var h=head()+'<h2>'+inf.t+'</h2><p>'+inf.i+'</p>';
 var c='';
 if(M.id==='cpu'){
  c='<div class="act"><button class="btn ghost" data-a="rot" data-fk="rot">↻ Draai 90°</button><button class="btn" data-a="cpuPlace" data-fk="place">Plaats processor</button></div>';
 } else if(M.id==='ram'){
  c='<p class="tip">Tik op twee sleuven in de tekening. Geselecteerd: '+(M.sel.length?M.sel.map(function(i){return 'sleuf '+(i+1);}).join(' en '):'nog niets')+'.</p><div class="act"><button class="btn" data-a="ramPlace" data-fk="place"'+(M.sel.length===2?'':' disabled')+'>Druk de modules erin</button></div>';
 } else if(M.id==='ssd'||M.id==='mount'){
  c='<div class="optlist">'+M.perm.map(function(i){var it=M.items[i],dn=i<M.next;return '<button class="ordbtn'+(dn?' d':'')+'" data-a="ord" data-i="'+i+'" data-fk="ord-'+i+'"><span class="n">'+(dn?(i+1):'·')+'</span><span>'+it.t+'</span></button>';}).join('')+'</div>';
 } else if(M.id==='gpu'){
  var L=layout(p);
  c='<div class="optlist">'+slotsOf(L).map(function(sl,i){return '<button class="choice" data-a="pslot" data-i="'+i+'" data-fk="ps-'+i+'" aria-pressed="'+(M.sel===i)+'" style="'+(M.sel===i?'border-color:var(--copper)':'')+'">'+sl.n+'</button>';}).join('')+'</div><div class="act"><button class="btn" data-a="gpuPlace" data-fk="place"'+(M.sel===null?' disabled':'')+'>Plaats videokaart</button></div>';
 } else if(M.id==='cables'){
  var list=CABLES.filter(function(x){return !x.gpu||p.gpu.len>0;});
  c='<div class="optlist">'+list.map(function(x){var dn=A.cab[x.id];return '<button class="cab'+(dn?' d':'')+'" data-a="cab" data-id="'+x.id+'" data-fk="c-'+x.id+'" aria-pressed="'+(M.sel===x.id)+'"'+(dn?' disabled':'')+'><i style="background:var('+x.col+')"></i><span>'+(dn?'✓ ':'')+x.name+'</span></button>';}).join('')+'</div><p class="tip">Aangesloten: '+list.filter(function(x){return A.cab[x.id];}).length+' van '+list.length+'.</p>';
 } else {
  var q=M.qs[M.qi];
  c='<p><b>'+q.q+'</b></p><div class="optlist">'+M.perms[M.qi].map(function(i){var o=q.o[i],tr=M.tried[M.qi+'-'+i];return '<button class="choice" data-a="ch" data-i="'+i+'" data-fk="ch-'+i+'"'+(tr?' disabled':'')+'>'+o.t+'</button>';}).join('')+'</div>';
 }
 return h+msgBox()+c;
}
function panelFinish(){
 var p=S.picks,A=S.A;
 var lines=['Even geduld...','','POST  .................... gestart',
  'Processor  '+p.cpu.name+' ........ OK','Geheugen   '+p.ram.gb+' GB '+p.ram.type+' (dual channel) ... OK',
  p.gpu.len?'Videokaart '+p.gpu.name+' ..... OK':'Graphics   ingebouwd in de processor ... OK',
  'Opslag     '+p.ssd.name+' ....... OK','Koeling    CPU_FAN draait ....... OK','','Besturingssysteem laden...'];
 return head().replace(/Stap.*?·/,'Klaar ·')+'<h2>Hij start op</h2>'+msgBox()+
  '<div class="post" role="img" aria-label="Opstartscherm van de pc">'+lines.map(function(l,i){return '<span style="animation-delay:'+(i*0.35)+'s">'+(l===''?' ':l)+'</span>';}).join('')+'</div>'+
  '<div class="act"><button class="btn" data-a="results" data-fk="res">Bekijk je uitslag</button></div>';
}

/* ---------- uitslag ---------- */
function viewResult(){
 var b=brief(),p=S.picks,t=total(p),A=S.A,f=S.final;
 var rows=CATS.map(function(c){return '<tr><td>'+c.label+'</td><td>'+p[c.id].name+'</td><td>'+euro(p[c.id].price)+'</td></tr>';}).join('');
 var badge=function(on,lbl,txt){return '<div class="badge'+(on?' on':'')+'"><span class="stars">'+(on?'★':'☆')+'</span><b>'+lbl+'</b><br><span class="small muted">'+txt+'</span></div>';};
 return shell(
  '<section><p class="kicker mono">Opdracht · '+b.naam+'</p><h1 style="font-size:clamp(40px,8vw,72px)">Je pc draait.</h1>'+
  '<p class="lead">'+stars(f.n)+' · '+b.klant+' is blij met de build. Hij kostte '+euro(t)+' van '+euro(b.budget)+'.</p>'+
  '<div class="res-grid">'+badge(true,'Gebouwd en opgestart','Alle stappen gedaan.')+badge(f.s2,'Slim gekozen','Onderdelen goed met hooguit 1 mislukte controle. Jij had '+S.attempts+'.')+badge(f.s3,'Netjes gemonteerd','Hooguit 2 foutjes bij de montage. Jij had '+A.mistakes+'.')+'</div>'+
  '<div class="card"><div class="tbl-wrap"><table class="tbl"><tbody>'+rows+'<tr><td><b>Totaal</b></td><td></td><td><b>'+euro(t)+'</b></td></tr></tbody></table></div></div>'+
  '<h2>Dit heb je geleerd</h2><ul class="learn">'+
  '<li>Het socket bepaalt welke processor op welk moederbord past. Het geheugentype (DDR4 of DDR5) en het bordformaat (ATX of mATX) moeten ook kloppen.</li>'+
  '<li>Voeding: processor + videokaart + 100 W, met 30% marge. Te zwak geeft crashes.</li>'+
  '<li>Volgorde: eerst op het bord (processor, geheugen, SSD, koeler), dan in de behuizing, kabels als laatste.</li>'+
  '<li>Gouden driehoekje op één lijn, een erwtgrote druppel pasta, geheugen in sleuf 2 en 4 voor dual channel.</li>'+
  '<li>Het geheugentype bepaalt ook de prijs: bij het huidige RAM-tekort is een DDR4-build een stuk goedkoper dan DDR5.</li>'+
  '<li>Zet na de eerste start het XMP- of EXPO-profiel aan in het BIOS.</li></ul>'+
  ICT.kist(KIST_OPT)+'<div class="act"><button class="btn" data-a="start" data-id="'+b.id+'" data-fk="again">Dezelfde opdracht opnieuw</button><button class="btn ghost" data-a="home" data-fk="home">Andere opdracht</button></div></section>',2);
}

/* ---------- renderen ---------- */
function render(top){
 var fk=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.fk:null;
 var h=S.screen==='start'?viewStart():S.screen==='pick'?viewPick():S.screen==='build'?viewBuild():viewResult();
 app.innerHTML=h;
 if(top)window.scrollTo(0,0);
 if(fk){var e=app.querySelector('[data-fk="'+fk+'"]');if(e&&!e.disabled)e.focus({preventScroll:true});}
}

/* ---------- acties ---------- */
function mistake(text){S.A.mistakes++;S.A.msg={kind:'bad',text:text};render();}
function completeStep(id,text){
 var A=S.A;A.done[id]=true;A.M=null;
 A.msg={kind:'ok',text:text};
 if(A.steps.every(function(s){return A.done[s.id];}))A.finished=true;
 render(true);
}
function startBuild(){
 var p=S.picks,steps=buildSteps(p);
 S.A={cpuTarget:Math.floor(Math.random()*4),steps:steps,done:{},M:null,msg:null,mistakes:0,finished:false,cab:{},shuf:shuffle(steps.map(function(s){return s.id;}))};
 S.screen='build';render(true);
}
function initM(id){
 var p=S.picks;
 if(id==='cpu'){var tg=S.A.cpuTarget*90,opts=[0,90,180,270].filter(function(r){return r!==tg;});return {id:id,rot:opts[Math.floor(Math.random()*opts.length)]};}
 if(id==='ram')return {id:id,sel:[]};
 if(id==='ssd'||id==='mount'){var it=ORD[id]();return {id:id,items:it,perm:shuffle(it.map(function(x,i){return i;})),next:0};}
 if(id==='gpu')return {id:id,sel:null};
 if(id==='cables')return {id:id,sel:null};
 var qs=CH[id](p);return {id:id,qs:qs,qi:0,perms:qs.map(function(q){return shuffle(q.o.map(function(x,i){return i;}));}),tried:{}};
}
var act={
 home:function(){S.screen='start';render(true);},
 start:function(el){S.briefId=el.dataset.id;S.picks={};S.cat='cpu';S.attempts=0;S.v=null;S.A=null;S.screen='pick';render(true);},
 cat:function(el,e){if(e)e.preventDefault();S.cat=el.dataset.id;render();},
 pick:function(el){
  var c=el.dataset.cat,o=PARTS[c].filter(function(x){return x.id===el.dataset.id;})[0];
  if(S.picks[c]&&S.picks[c].id===o.id)delete S.picks[c];else S.picks[c]=o;
  S.v=null;render();
 },
 check:function(){
  var p=S.picks,b=brief(),miss=CATS.filter(function(c){return !p[c.id];});
  if(miss.length){S.v={kind:'missing',items:miss.map(function(c){return c.label.toLowerCase();})};render();window.scrollTo(0,0);return;}
  var items=[];
  compat(p).forEach(function(r){if(r.ok===false)items.push({t:r.label,m:r.msg});});
  reqs(p,b).forEach(function(r){if(r.ok===false)items.push({t:'Opdracht',m:r.msg});});
  var t=total(p);if(t>b.budget)items.push({t:'Budget',m:'Je zit '+euro(t-b.budget)+' boven het budget van '+euro(b.budget)+'.'});
  if(items.length){S.attempts++;S.v={kind:'bad',items:items};render();window.scrollTo(0,0);return;}
  S.v=null;startBuild();
 },
 step:function(el){
  var A=S.A,id=el.dataset.id,st=A.steps.filter(function(s){return s.id===id;})[0];
  var miss=st.req.filter(function(r){return !A.done[r];});
  if(miss.length){
   var names=miss.map(function(r){return A.steps.filter(function(s){return s.id===r;})[0].t.toLowerCase();});
   mistake(st.why+' Eerst nog: '+names.join(', ')+'.');return;
  }
  A.msg=null;A.M=initM(id);render(true);
 },
 rot:function(){S.A.M.rot=(S.A.M.rot+90)%360;render();},
 cpuPlace:function(){
  var M=S.A.M;
  if(M.rot!==S.A.cpuTarget*90){mistake('Het driehoekje ligt niet op het driehoekje van het socket. Niet forceren: zo buig je pennen en is de processor of het bord kapot. Draai hem eerst goed.');return;}
  completeStep('cpu',info('cpu',S.picks).s);
 },
 ramSlot:function(el){
  var M=S.A.M,i=+el.dataset.i,k=M.sel.indexOf(i);
  if(k>=0)M.sel.splice(k,1);else if(M.sel.length<2)M.sel.push(i);
  render();
 },
 ramPlace:function(){
  var M=S.A.M,s=M.sel.slice().sort().join();
  if(s==='1,3'){completeStep('ram',info('ram',S.picks).s);return;}
  if(s==='0,1'||s==='2,3')mistake('Die twee sleuven zitten op hetzelfde kanaal. Dan werkt het geheugen op één kanaal (single channel) en is het veel trager.');
  else mistake('Dat werkt misschien, maar de handleiding adviseert sleuf 2 en 4 (tel vanaf de processor) voor dual channel.');
  M.sel=[];render();
 },
 ord:function(el){
  var M=S.A.M,i=+el.dataset.i;
  if(i<M.next)return;
  if(i===M.next){
   M.next++;
   if(M.next>=M.items.length){completeStep(M.id,info(M.id,S.picks).s);return;}
   render();return;
  }
  mistake(M.items[i].e);
 },
 ch:function(el){
  var M=S.A.M,i=+el.dataset.i,q=M.qs[M.qi],o=q.o[i];
  if(!o.ok){M.tried[M.qi+'-'+i]=true;mistake(o.w);return;}
  if(M.qi<M.qs.length-1){M.qi++;S.A.msg={kind:'ok',text:q.y};render();return;}
  completeStep(M.id,q.y+(info(M.id,S.picks).s?' '+info(M.id,S.picks).s:''));
 },
 pslot:function(el){S.A.M.sel=+el.dataset.i;render();},
 gpuPlace:function(){
  var M=S.A.M,p=S.picks;
  if(M.sel===0){completeStep('gpu',info('gpu',p).s);return;}
  var L=layout(p),m;
  if(M.sel===2)m='Dat slot is wel lang, maar het loopt via de chipset en werkt maar met een kwart van de banen (x4). De videokaart zou veel trager zijn. Gebruik het bovenste lange slot, dat zit rechtstreeks op de processor.';
  else m='Dat is een korte x1-sleuf. Daar past een videokaart niet in en hij zou te weinig bandbreedte hebben.';
  M.sel=null;mistake(m);
 },
 cab:function(el){S.A.M.sel=el.dataset.id;render();},
 port:function(el){
  var A=S.A,M=A.M,k=el.dataset.id;
  if(!M.sel){A.msg={kind:'bad',text:'Kies eerst een kabel in de lijst.'};render();return;}
  var cab=CABLES.filter(function(c){return c.id===M.sel;})[0];
  if(cab.id===k){
   A.cab[k]=true;M.sel=null;
   var left=CABLES.filter(function(c){return (!c.gpu||S.picks.gpu.len>0)&&!A.cab[c.id];});
   if(!left.length){completeStep('cables',info('cables',S.picks).s);return;}
   A.msg={kind:'ok',text:'Klik. '+cab.name+' zit erin.'};render();return;
  }
  var extra=((cab.id==='eps'&&k==='pcie')||(cab.id==='pcie'&&k==='eps'))?' Let op: EPS (processor) en PCIe (videokaart) lijken op elkaar maar mogen nooit verwisseld worden.':'';
  M.sel=null;mistake('Dat is '+PORTNAME[k]+'. De kabel “'+cab.name.toLowerCase()+'” hoort bij '+cab.target+'.'+extra);
 },
 results:function(){
  var p=S.picks,A=S.A;
  var s2=S.attempts<=1,s3=A.mistakes<=2,n=1+(s2?1:0)+(s3?1:0);
  S.final={s2:s2,s3:s3,n:n};saveBest(S.briefId,n);S.screen='result';render(true);
 }
};
var MINI=['rot','cpuPlace','ramSlot','ramPlace','ord','ch','pslot','gpuPlace','cab','port'];
document.addEventListener('click',function(e){
 var el=e.target.closest?e.target.closest('[data-a]'):null;
 if(!el||!app.contains(el))return;
 var a=el.dataset.a;
 if(MINI.indexOf(a)>=0&&!(S.A&&S.A.M))return;
 var f=act[a];if(f)f(el,e);
});
document.addEventListener('keydown',function(e){
 if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.namespaceURI==='http://www.w3.org/2000/svg'){
  e.preventDefault();var a2=e.target.dataset.a;
  if(MINI.indexOf(a2)>=0&&!(S.A&&S.A.M))return;
  var f=act[a2];if(f)f(e.target,e);
 }
});
document.addEventListener('change',function(e){
 if(e.target&&e.target.id==='help'){S.help=e.target.checked;}
});
render();
})();
</script>
