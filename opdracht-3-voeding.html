var root=document.documentElement;
var savedTheme=get('ict-theme');
if(savedTheme==='dark'||savedTheme==='light')root.setAttribute('data-theme',savedTheme);
function loadFont(){if(document.getElementById('ict-cinzel'))return;try{var l=document.createElement('link');l.id='ict-cinzel';l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap';document.head.appendChild(l);}catch(e){}}
function applyStyle(s){
 if(s==='rpg'){root.setAttribute('data-style','rpg');if(!get('ict-theme'))root.setAttribute('data-theme','dark');loadFont();}
 else{root.removeAttribute('data-style');if(!get('ict-theme'))root.removeAttribute('data-theme');}
}
applyStyle(get('ict-stijl'));
function isRpg(){return root.getAttribute('data-style')==='rpg';}

function playOpen(ch){
 var row=ch.parentNode,key=row&&row.querySelector('.kkey');
 if(!key||reduce()||!key.animate){ch.classList.add('open');return;}
 var kr=key.getBoundingClientRect(),cr=ch.getBoundingClientRect(),sx=window.pageXOffset,sy=window.pageYOffset;
 var cl=key.cloneNode(true);
 cl.style.cssText='position:absolute;left:'+(kr.left+sx)+'px;top:'+(kr.top+sy)+'px;width:'+kr.width+'px;height:'+kr.height+'px;margin:0;z-index:9999;pointer-events:none;max-width:none;box-shadow:0 0 28px rgba(255,200,90,.7)';
 document.body.appendChild(cl);
 var dx=(cr.left+cr.width/2)-(kr.left+kr.width/2),dy=(cr.top+cr.height*.55)-(kr.top+kr.height/2);
 var a=cl.animate([
  {transform:'translate(0,0) scale(1) rotate(0)',opacity:1},
  {transform:'translate(0,-14px) scale(1.04) rotate(0)',opacity:1,offset:.18},

 ],{duration:1300,easing:'cubic-bezier(.5,0,.3,1)',fill:'forwards'});

var io=null,scanQ=false;
function scan(){
 scanQ=false;
 var list=document.querySelectorAll('[data-kplay]:not([data-kseen])');
 if(!list.length)return;
 if(!('IntersectionObserver' in window)){[].forEach.call(list,function(e){e.setAttribute('data-kseen','1');played[e.getAttribute('data-kplay')]=true;e.classList.add('open');});return;}
 if(!io)io=new IntersectionObserver(function(es){es.forEach(function(en){
  if(!en.isIntersecting)return;io.unobserve(en.target);
  var id=en.target.getAttribute('data-kplay');played[id]=true;en.target.removeAttribute('data-kplay');
  setTimeout(function(){playOpen(en.target);},350);
 });},{threshold:.6});
 [].forEach.call(list,function(e){e.setAttribute('data-kseen','1');io.observe(e);});
}

var MAP={'\u03a9':'ohm','‘':"'",'’':"'",'“':'"','”':'"','–':'-','—':'-','…':'...',' ':' ','•':'-','→':'->','✓':'v'};
var C1252={'€':128};
function enc(s){ /* tekst naar WinAnsi-bytecodes */
 var o=[];s=String(s==null?'':s);
 for(var k=0;k<s.length;k++){var ch=s.charAt(k);if(MAP[ch])ch=MAP[ch];
  for(var j=0;j<ch.length;j++){var c=ch.charCodeAt(j);
   if(c===9||c===13)c=32;
   if(C1252[ch.charAt(j)])c=C1252[ch.charAt(j)];
   else if(c>255||(c<32&&c!==10))c=63;
   o.push(c);}}
 return o;
}
function wid(codes,bold,sz){var t=bold?WB:WR,w=0;for(var k=0;k<codes.length;k++){var c=codes[k];w+=(c>=32?t[c-32]:0);}return w*sz/1000;}
function wrap(text,bold,sz,maxw){
 var lines=[];String(text==null?'':text).split(/\r?\n/).forEach(function(par){
  var words=enc(par),cur=[],curw=0,word=[];
  var flush=function(){ if(!word.length)return; var ww=wid(word,bold,sz);
   if(cur.length&&curw+wid([32],bold,sz)+ww>maxw){lines.push(cur);cur=word;curw=ww;}
   else{ if(cur.length){cur=cur.concat([32],word);curw+=wid([32],bold,sz)+ww;}else{cur=word;curw=ww;} }
   while(curw>maxw&&cur.length>1){var cut=cur.length-1;while(cut>1&&wid(cur.slice(0,cut),bold,sz)>maxw)cut--;lines.push(cur.slice(0,cut));cur=cur.slice(cut);curw=wid(cur,bold,sz);}
   word=[];};
  words.forEach(function(c){if(c===32){flush();}else word.push(c);});flush();
  lines.push(cur);
 });
 return lines;
}
function PDFDoc(){
 var pages=[],cur=null,imgs=[],PW=595.28,PH=841.89,M=48,y=0;
 function np(){cur={ops:[],im:{}};pages.push(cur);y=PH-M;}
 function esc2(codes){var s='';codes.forEach(function(c){s+=(c===40||c===41||c===92)?'\\'+String.fromCharCode(c):(c<32||c>126)?'\\'+('00'+c.toString(8)).slice(-3):String.fromCharCode(c);});return s;}
 function need(h){if(!cur||y-h<M+10)np();}
 function text(str,o){
  o=o||{};var sz=o.size||10.5,lead=o.lead||sz*1.4,x=M+(o.indent||0),bold=!!o.bold,maxw=PW-2*M-(o.indent||0),col=o.color||'0.11 0.14 0.19';
  wrap(str,bold,sz,maxw).forEach(function(l){need(lead);y-=lead;cur.ops.push('BT /'+(bold?'F2':'F1')+' '+sz+' Tf '+col+' rg '+x.toFixed(2)+' '+y.toFixed(2)+' Td ('+esc2(l)+') Tj ET');});
 }
 function gap(h){y-=h;}
 function rule(){need(8);cur.ops.push('0.85 0.83 0.79 RG 0.8 w '+M+' '+(y-3).toFixed(2)+' m '+(PW-M)+' '+(y-3).toFixed(2)+' l S');y-=8;}
 function image(im,maxw,maxh){
  var b=atob(im.d.split(',')[1]),u=new Uint8Array(b.length);for(var k=0;k<b.length;k++)u[k]=b.charCodeAt(k);
  var sc=Math.min(maxw/im.w,maxh/im.h,1),w=im.w*sc,h=im.h*sc;need(h+12);y-=6;
  var id='I'+imgs.length;imgs.push({u:u,w:im.w,h:im.h});cur.im[id]=imgs.length;
  y-=h;cur.ops.push('q '+w.toFixed(2)+' 0 0 '+h.toFixed(2)+' '+M+' '+y.toFixed(2)+' cm /'+id+' Do Q');y-=6;
 }
 function build(title){
  var parts=[],len=0,offs=[];
  function put(x){var u=typeof x==='string'?strBytes(x):x;parts.push(u);len+=u.length;}
  function strBytes(s){var u=new Uint8Array(s.length);for(var k=0;k<s.length;k++)u[k]=s.charCodeAt(k)&255;return u;}
  var objs=[];/* 1 catalog 2 pages 3 F1 4 F2 */
  var nImg=imgs.length,first=5,imgBase=first,pageBase=first+nImg;
  put('%PDF-1.4\n');
  function obj(n,body){offs[n]=len;put(n+' 0 obj\n');if(typeof body==='string')put(body);else{body();}put('\nendobj\n');}
  var kids=[];for(var p=0;p<pages.length;p++)kids.push((pageBase+p*2)+' 0 R');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+pages.length+' >>');
  obj(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  obj(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  imgs.forEach(function(im,k){var n=imgBase+k;offs[n]=len;put(n+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.u.length+' >>\nstream\n');put(im.u);put('\nendstream\nendobj\n');});
  pages.forEach(function(pg,p){
   var n=pageBase+p*2,cn=n+1,xo='';Object.keys(pg.im).forEach(function(k){xo+='/'+k+' '+(imgBase+pg.im[k]-1)+' 0 R ';});
   var foot='BT /F1 8.5 Tf 0.45 0.47 0.52 rg '+M+' 28 Td ('+esc2(enc(title))+') Tj ET BT /F1 8.5 Tf 0.45 0.47 0.52 rg '+(PW-M-40)+' 28 Td (Pagina '+(p+1)+' van '+pages.length+') Tj ET';
   var cs=pg.ops.join('\n')+'\n'+foot;
   obj(n,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /XObject << '+xo+'>> >> /Contents '+cn+' 0 R >>');
   obj(cn,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
  });
  var total=pageBase+pages.length*2,xr=len;
  put('xref\n0 '+total+'\n0000000000 65535 f \n');
  for(var n=1;n<total;n++)put(('0000000000'+offs[n]).slice(-10)+' 00000 n \n');
  put('trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  var out=new Uint8Array(len),pos=0;parts.forEach(function(u){out.set(u,pos);pos+=u.length;});return out;
 }
 np();
 return {keep:need,text:text,gap:gap,rule:rule,image:image,build:build,newPage:np,get y(){return y;}};
}

/* ---------- automatisch nakijken ---------- */
var GRN='0.09 0.50 0.24',RED='0.78 0.12 0.12',AMB='0.60 0.40 0.05';
function cp(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');}
function num(s){var m=String(s).match(/\d[\d.,]*/);if(!m)return NaN;var t=m[0].replace(/[.,]+$/,'');if(t.indexOf(',')>-1)t=t.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');var x=parseFloat(t);return x;}
function ev(r,val){ /* geeft {s:'g'|'f'|'n'|'d', show, note} */
 var v=val==null?'':String(val).trim();
 var show=r.show||'';
 if(!v)return {s:'n',show:show};
 if(r.e!=null)return {s:v.toLowerCase()===String(r.e).toLowerCase()?'g':'f',show:show};
 if(r.n){var x=num(v);return {s:(x===x&&x>=r.n[0]-1e-9&&x<=r.n[1]+1e-9)?'g':'f',show:show};}
 if(r.k){var c=cp(v),h=0;r.k.forEach(function(p){if(p.some(function(w){return c.indexOf(cp(w))>-1;}))h++;});
  if(h>=r.min)return {s:'g',show:show};
  return r.f?{s:'f',show:show}:{s:'d',show:show,note:h+' van '+r.min+' benodigde kernpunten herkend'};}
 return {s:'d',show:show};
}
function evItem(i){
 var K=(typeof KEY==='object'&&KEY)?KEY[i.id]:null,o={one:null,cells:{}},id=i.id;
 if(!K)return o;
 if(i.t==='area'||i.t==='line'||i.t==='vorm')o.one=ev(K,S.v[id]);
 else if(i.t==='zoek')o.one=ev(K,S.v[id+'-prijs']);
 else if(i.t==='map'||i.t==='pick'){(i.t==='map'?i.terms:i.items).forEach(function(_,k){o.cells[id+'-'+k]=ev({e:K.a[k],show:K.a[k]},S.v[id+'-'+k]);});}
 else if(i.t==='mapt'){i.markers.forEach(function(m,k){if(K.w[k])o.cells[id+'-'+k]=ev(K.w[k],S.v[id+'-'+k]);});}
 else if(i.t==='selrij'||i.t==='tabel'){i.rows.forEach(function(r,k){i.cols.forEach(function(c,j){var q=k+'-'+j,cid=id+'-'+q;
   if(i.t==='selrij'){if(K.a&&K.a[q]!=null)o.cells[cid]=ev({e:K.a[q],show:K.a[q]},S.v[cid]);}
   else if(K.c&&K.c[q])o.cells[cid]=ev(K.c[q],S.v[cid]);});});}
 return o;
}

function tally(){var t={g:0,f:0,d:0};
 allItems().forEach(function(i){var r=results(i);
  if(!r.length){if(i.t!=='check'&&i.t!=='checks')t.d++;return;}
  r.forEach(function(x){if(x.s==='g')t.g++;else if(x.s==='d')t.d++;else t.f++;});});

function tag(x){
 if(x.s==='g')return {t:'GOED',c:GRN};
 if(x.s==='n')return {t:'NIET INGEVULD'+(x.show?' - juist: '+x.show:''),c:RED};

function worst(a){return a.some(function(x){return x.s==='f'||x.s==='n';})?RED:a.some(function(x){return x.s==='d';})?AMB:GRN;}

    i.terms.forEach(function(t,k){var x=R.cells[i.id+'-'+k],g=x?tag(x):null;d.text(t+'  ->  '+(S.v[i.id+'-'+k]?'plek '+S.v[i.id+'-'+k]:'(niet ingevuld)')+(g?'   ->  '+g.t:''),{indent:12,color:g?g.c:'0.11 0.14 0.19'});});
   }else if(i.t==='pick'){
    i.items.forEach(function(p,k){var x=R.cells[i.id+'-'+k],g=x?tag(x):null;d.text('Afbeelding '+(k+1)+' ('+p.alt+')  ->  '+(S.v[i.id+'-'+k]||'(niet ingevuld)')+(g?'   ->  '+g.t:''),{indent:12,color:g?g.c:'0.11 0.14 0.19'});});
   }
   if(R.one){var g1=tag(R.one);d.text(g1.t,{indent:12,size:9.5,bold:true,color:g1.c});}
  });
 });
 return {bytes:d.build(title),title:title};
}
var PW_MAX=420;
function scoreTxt(){var T=tally();return (T.g+T.f)?'Nagekeken: '+T.g+' van '+(T.g+T.f)+' goed.':'';}
function fname(){var n=(S.naam||'leerling').trim().replace(/[^A-Za-z0-9À-ÿ]+/g,'-').replace(/^-+|-+$/g,'')||'leerling';return 'Portfolio-opdracht-'+OPD.nr+'-'+OPD.slug+'-'+n+'.pdf';}
function makePdf(){
 var m=document.getElementById('pf-msg'),btn=document.getElementById('pf-pdf');
 if(!S.naam.trim()){m.textContent='Vul eerst bovenaan je naam in.';var f=document.getElementById('pf-naam');if(f){f.scrollIntoView({block:'center'});f.focus();}return;}
 var out;try{out=composePdf();}catch(e){m.textContent='De PDF maken is niet gelukt. Meld dit bij je docent.';return;}
 var blob=new Blob([out.bytes],{type:'application/pdf'}),name=fname();
 var fallback=function(){
  try{var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(u);},1500);m.textContent='Je PDF wordt gedownload: '+name+'. '+scoreTxt()+' Kijk in je map Downloads.';markDone();}
  catch(e){m.textContent='Downloaden lukt hier niet. Open de site in een gewone browser.';}
 };
 if(window.claude&&window.claude.use){
  window.claude.use('downloads').then(function(dl){
   if(!dl){fallback();return;}
   dl.save({filename:name,data:blob}).then(function(){m.textContent='Opgeslagen als '+name+'. '+scoreTxt()+' Lever dit bestand in bij je docent.';markDone();},function(er){if(er&&er.code==='declined'){m.textContent='Je hebt het opslaan geannuleerd. Klik nog een keer om het opnieuw te proberen.';}else fallback();});
  },function(){fallback();});
 }else fallback();
}
function markDone(){try{localStorage.setItem(LSK+'-pdf',new Date().toISOString());}catch(e){}}
render();
window.__PF={S:S,get progress(){return progress();},compose:composePdf,render:render};

})();
</script>
